<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Community Trips</title>
  <style data-trek-ui>
/* TREK plugin design kit — token-driven, matches the host in light + dark. */
:root {
  color-scheme: light;
  /* Live tokens (the host overrides these per theme/accent via the bridge). */
  --bg-primary: #ffffff; --bg-secondary: #f8fafc; --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff; --bg-input: #ffffff; --bg-hover: rgba(0,0,0,.03); --bg-selected: #e2e8f0;
  --text-primary: #111827; --text-secondary: #374151; --text-muted: #6b7280; --text-faint: #9ca3af;
  --border-primary: #e5e7eb; --border-secondary: #f3f4f6; --border-faint: rgba(0,0,0,.06);
  --accent: #111827; --accent-text: #ffffff; --accent-hover: #1f2937; --accent-subtle: #f1f5f9;
  --success: #16a34a; --success-soft: #dcfce7; --danger: #dc2626; --danger-soft: #fef2f2;
  --warning: #d97706; --warning-soft: #fffbeb; --info: #2563eb; --info-soft: #eff6ff;
  --shadow-card: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05); --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --font-system: 'Poppins', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  /* Baked glass layer (mirrors the host's .trek-dash; not sent over the bridge). */
  --glass-bg: linear-gradient(135deg, oklch(1 0 0 / .72) 0%, oklch(0.99 0.006 75 / .5) 100%);
  --glass-border: oklch(0.88 0.008 70 / .7);
  --glass-shadow: 0 1px 2px oklch(0.4 0.02 60 / .05), 0 12px 32px -14px oklch(0.3 0.02 60 / .2);
  --glass-shadow-hover: 0 2px 6px oklch(0.4 0.02 60 / .07), 0 26px 56px -20px oklch(0.25 0.04 60 / .32);
  --glass-highlight: inset 0 1px 0 oklch(1 0 0 / .8);
  --glass-blur: blur(22px) saturate(1.7);
  --r-sm: 14px; --r-md: 18px; --r-lg: 22px; --r-xl: 28px;
  /* The house easings: a punchy card curve and TREK's ease-out-quint. */
  --trek-ease: cubic-bezier(.2,.7,.2,1);
  --trek-ease-quint: cubic-bezier(.23,1,.32,1);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg-primary: #121215; --bg-secondary: #1a1a1e; --bg-tertiary: #1c1c21;
  --bg-card: #131316; --bg-input: #1c1c21; --bg-hover: rgba(255,255,255,.06); --bg-selected: rgba(255,255,255,.1);
  --text-primary: #f4f4f5; --text-secondary: #d4d4d8; --text-muted: #a1a1aa; --text-faint: #71717a;
  --border-primary: #27272a; --border-secondary: #1c1c21; --border-faint: rgba(255,255,255,.07);
  --accent: #e4e4e7; --accent-text: #09090b; --accent-hover: #d4d4d8; --accent-subtle: rgba(255,255,255,.08);
  --success: #22c55e; --success-soft: rgba(34,197,94,.15); --danger: #ef4444; --danger-soft: rgba(239,68,68,.15);
  --warning: #f59e0b; --warning-soft: rgba(245,158,11,.15); --info: #3b82f6; --info-soft: rgba(59,130,246,.15);
  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  --glass-bg: linear-gradient(135deg, oklch(0.31 0 0 / .58) 0%, oklch(0.25 0 0 / .42) 100%);
  --glass-border: oklch(1 0 0 / .1);
  --glass-shadow: 0 1px 2px oklch(0 0 0 / .3), 0 12px 32px -14px oklch(0 0 0 / .55);
  --glass-shadow-hover: 0 2px 6px oklch(0 0 0 / .4), 0 26px 56px -20px oklch(0 0 0 / .72);
  --glass-highlight: inset 0 1px 0 oklch(1 0 0 / .09);
}

/* Base: a light reset + native type. The bootstrap adds `trek-ui` to <body>. */
*, *::before, *::after { box-sizing: border-box; }
body.trek-ui {
  margin: 0;
  font-family: var(--font-system);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.trek-ui :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Cards + panels ----------------------------------------------------------- */
.trek-card {
  background: var(--bg-card);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 16px;
}
.trek-glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  box-shadow: var(--glass-shadow), var(--glass-highlight);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  padding: 24px 26px;
}
/* Add to a card/glass to make it lift on hover, like a native tool tile. */
.trek-interactive {
  transition: transform .3s var(--trek-ease), box-shadow .3s, border-color .3s;
  cursor: pointer;
}
.trek-glass.trek-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--glass-shadow-hover), var(--glass-highlight);
}
.trek-card.trek-interactive:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.trek-interactive:active { transform: translateY(0); }

/* Buttons ------------------------------------------------------------------ */
.trek-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 12px;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 1;
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .08s var(--trek-ease-quint), background .15s, box-shadow .15s, border-color .15s, color .15s;
}
.trek-btn:active { transform: scale(.97); }
.trek-btn:disabled { opacity: .5; cursor: not-allowed; }
.trek-btn--primary { background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow-sm); }
.trek-btn--primary:hover:not(:disabled) { background: var(--accent-hover); }
.trek-btn--secondary { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-primary); box-shadow: var(--shadow-sm); }
.trek-btn--secondary:hover:not(:disabled) { background: var(--bg-hover); }
.trek-btn--ghost { background: transparent; color: var(--text-secondary); }
.trek-btn--ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }
.trek-btn--danger { background: var(--danger); color: #fff; }
.trek-btn--danger:hover:not(:disabled) { filter: brightness(1.05); }

/* Form controls ------------------------------------------------------------ */
.trek-input, .trek-textarea, .trek-select {
  width: 100%; box-sizing: border-box;
  padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--border-primary); background: var(--bg-input); color: var(--text-primary);
  font: inherit; font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.trek-textarea { resize: vertical; min-height: 72px; }
.trek-input::placeholder, .trek-textarea::placeholder { color: var(--text-faint); }
.trek-input:focus, .trek-textarea:focus, .trek-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
}
.trek-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

/* Enhanced select — the kit upgrades a native <select> into this listbox so the
   dropdown matches the host (a native popup is drawn by the OS and can't be
   themed). The real <select> stays in the DOM as the value source. */
.trek-select-wrap { position: relative; }
.trek-select-native-hidden {
  position: absolute !important; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0;
}
.trek-select-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: start; cursor: pointer;
}
.trek-select-trigger:disabled { opacity: .5; cursor: not-allowed; }
.trek-select-trigger[aria-expanded="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 22%, transparent);
}
.trek-select-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trek-select-caret { flex: none; display: inline-flex; color: var(--text-faint); transition: transform .15s; }
.trek-select-trigger[aria-expanded="true"] .trek-select-caret { transform: rotate(180deg); }
.trek-select-menu {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 50;
  margin-top: 6px; padding: 4px;
  max-height: 260px; overflow-y: auto;
  background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border-primary); border-radius: 10px;
  box-shadow: var(--shadow-md);
}
.trek-select-menu[data-placement="top"] { top: auto; bottom: 100%; margin-top: 0; margin-bottom: 6px; }
.trek-select-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 7px; cursor: pointer;
  font-size: 13px; white-space: nowrap;
}
.trek-select-option.trek-active { background: var(--bg-hover); }
.trek-select-option[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.trek-select-option[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }

/* Chips + badges ----------------------------------------------------------- */
.trek-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--text-secondary); background: var(--accent-subtle);
}
.trek-chip--accent  { color: var(--accent);  background: color-mix(in oklch, var(--accent) 12%, transparent); }
.trek-chip--success { color: var(--success); background: var(--success-soft); }
.trek-chip--danger  { color: var(--danger);  background: var(--danger-soft); }
.trek-chip--warning { color: var(--warning); background: var(--warning-soft); }
.trek-chip--info    { color: var(--info);    background: var(--info-soft); }

/* Rows + text helpers ------------------------------------------------------ */
.trek-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px; cursor: pointer;
  transition: background .12s;
}
.trek-row:hover { background: var(--bg-hover); }
/* A plain flex row for laying out controls (modal footers, a search box + button) — .trek-row's
   pointer cursor and hover highlight are meant for an actually-clickable row (e.g. the trip
   picker); reusing it purely for alignment made empty space around a footer button look
   (mis)clickable. */
.btn-row { display: flex; align-items: center; gap: 12px; }
.trek-title { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); }
.trek-muted { color: var(--text-muted); }
.trek-faint { color: var(--text-faint); }

/* Layout helpers ----------------------------------------------------------- */
.trek-stack { display: flex; flex-direction: column; gap: 12px; }
.trek-cluster { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

/* Motion library — the host's animation vocabulary, mirrored 1:1 from
   index.css so plugin UI moves exactly like TREK does. ---------------------- */
@keyframes trek-menu-enter {
  from { opacity: 0; transform: scale(0.95) translateY(-4px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes trek-popover-enter {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes trek-modal-enter {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes trek-backdrop-enter {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes trek-toast-enter {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes trek-progress-fill {
  from { width: 0%; }
  to   { width: var(--trek-progress-to, 0%); }
}
@keyframes trek-pie-reveal {
  from { opacity: 0; transform: rotate(-90deg) scale(0.85); }
  to   { opacity: 1; transform: rotate(0deg) scale(1); }
}
@keyframes trek-bar-fill {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}
@keyframes trek-page-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes trek-shimmer {
  from { background-position: -200% 0; }
  to   { background-position: 200% 0; }
}
@keyframes trek-drawer-enter {
  from { opacity: 0; transform: translateY(100%); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes trek-fade-up {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.trek-menu-enter {
  animation: trek-menu-enter 200ms var(--trek-ease-quint);
  transform-origin: top right; will-change: transform, opacity;
}
.trek-menu-enter-left {
  animation: trek-menu-enter 200ms var(--trek-ease-quint);
  transform-origin: top left; will-change: transform, opacity;
}
.trek-popover-enter { animation: trek-popover-enter 180ms var(--trek-ease-quint); will-change: transform, opacity; }
.trek-modal-enter { animation: trek-modal-enter 220ms var(--trek-ease-quint); will-change: transform, opacity; }
@media (max-width: 639px) {
  .trek-modal-enter { animation: trek-drawer-enter 320ms cubic-bezier(0.32, 0.72, 0, 1); }
}
.trek-backdrop-enter { animation: trek-backdrop-enter 180ms var(--trek-ease-quint); }
.trek-toast-enter { animation: trek-toast-enter 260ms var(--trek-ease-quint); will-change: transform, opacity; }
.trek-pie-reveal {
  animation: trek-pie-reveal 900ms var(--trek-ease-quint) both;
  transform-origin: center; will-change: transform, opacity;
}
.trek-bar-fill {
  animation: trek-bar-fill 700ms var(--trek-ease-quint) both;
  transform-origin: left center; will-change: transform;
}
.trek-page-enter { animation: trek-page-enter 220ms var(--trek-ease-quint) both; }
.trek-skeleton {
  background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--bg-hover) 50%, var(--bg-tertiary) 100%);
  background-size: 200% 100%;
  animation: trek-shimmer 1.6s linear infinite;
  border-radius: 8px; color: transparent; user-select: none;
}
[data-theme="dark"] .trek-skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%);
  background-size: 200% 100%;
}
.trek-stagger > * { animation: trek-fade-up 280ms var(--trek-ease-quint) both; }
.trek-stagger > *:nth-child(1) { animation-delay: 0ms; }
.trek-stagger > *:nth-child(2) { animation-delay: 40ms; }
.trek-stagger > *:nth-child(3) { animation-delay: 80ms; }
.trek-stagger > *:nth-child(4) { animation-delay: 120ms; }
.trek-stagger > *:nth-child(5) { animation-delay: 160ms; }
.trek-stagger > *:nth-child(6) { animation-delay: 200ms; }
.trek-stagger > *:nth-child(7) { animation-delay: 240ms; }
.trek-stagger > *:nth-child(8) { animation-delay: 280ms; }
.trek-stagger > *:nth-child(n+9) { animation-delay: 320ms; }

/* Accessibility: mirror the host's own graceful-degrade rules. -------------- */
[data-no-transparency] .trek-glass {
  background: var(--bg-card); border-color: var(--border-primary);
  box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-reduce-motion] .trek-interactive,
[data-reduce-motion] .trek-btn,
[data-reduce-motion] .trek-row { transition: none; }
[data-reduce-motion] .trek-interactive:hover,
[data-reduce-motion] .trek-btn:active { transform: none; }
[data-reduce-motion] .trek-menu-enter, [data-reduce-motion] .trek-menu-enter-left,
[data-reduce-motion] .trek-popover-enter, [data-reduce-motion] .trek-modal-enter,
[data-reduce-motion] .trek-toast-enter, [data-reduce-motion] .trek-stagger > *,
[data-reduce-motion] .trek-page-enter {
  animation: trek-backdrop-enter 120ms ease-out;
}
[data-reduce-motion] .trek-pie-reveal, [data-reduce-motion] .trek-bar-fill {
  animation: trek-backdrop-enter 120ms ease-out both;
}
[data-reduce-motion] .trek-skeleton { animation: none; background: var(--bg-tertiary); }
[data-reduce-motion] .trek-select-caret { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .trek-interactive, .trek-btn, .trek-row, .trek-input, .trek-textarea, .trek-select, .trek-select-caret { transition: none; }
  .trek-interactive:hover, .trek-btn:active { transform: none; }
  .trek-menu-enter, .trek-menu-enter-left, .trek-popover-enter,
  .trek-modal-enter, .trek-toast-enter, .trek-stagger > *, .trek-page-enter {
    animation: trek-backdrop-enter 120ms ease-out;
  }
  .trek-pie-reveal, .trek-bar-fill { animation: trek-backdrop-enter 120ms ease-out both; }
  .trek-skeleton { animation: none; background: var(--bg-tertiary); }
}
</style>
<script data-trek-ui>
(function () {
  'use strict';
  var docEl = document.documentElement;
  var ctxHandlers = [];
  var evtHandlers = [];
  var lastCtx = null;
  var pending = {};
  var pendingConfirms = {};
  var seq = 0;
  var lastH = -1;

  function send(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function setFlag(name, on) { if (on) { docEl.setAttribute(name, ''); } else { docEl.removeAttribute(name); } }

  function applyContext(m) {
    if (m.theme) { docEl.setAttribute('data-theme', m.theme); }
    if (m.locale) { docEl.setAttribute('lang', m.locale); }
    docEl.setAttribute('dir', m.dir === 'rtl' ? 'rtl' : 'ltr');
    var t = m.tokens || {};
    for (var k in t) {
      if (Object.prototype.hasOwnProperty.call(t, k) && t[k]) { docEl.style.setProperty(k, t[k]); }
    }
    var a = m.appearance || {};
    setFlag('data-reduce-motion', a.reducedMotion);
    setFlag('data-no-transparency', a.noTransparency);
    if (a.density) { docEl.setAttribute('data-density', a.density); }
    if (a.scheme) { docEl.setAttribute('data-scheme', a.scheme); }
    if (document.body) { document.body.classList.add('trek-ui'); }
  }

  function reportHeight() {
    var h = Math.ceil(document.documentElement.scrollHeight);
    if (h > 0 && h !== lastH) { lastH = h; send({ type: 'trek:resize', height: h }); }
  }

  window.addEventListener('message', function (ev) {
    // Opaque frame: origin serialises to 'null', so trust the SENDER — only our real
    // parent window. Never act on a claimed id or on origin.
    if (ev.source !== window.parent) { return; }
    var m = ev.data;
    if (!m || typeof m !== 'object') { return; }
    if (m.type === 'trek:context') {
      lastCtx = m; api.context = m;
      applyContext(m);
      for (var i = 0; i < ctxHandlers.length; i++) { try { ctxHandlers[i](m); } catch (e) {} }
      reportHeight();
    } else if (m.type === 'trek:response') {
      var p = pending[m.requestId];
      if (p) { delete pending[m.requestId]; p.resolve(m.data); }
    } else if (m.type === 'trek:error') {
      var q = pending[m.requestId];
      if (q) { delete pending[m.requestId]; var err = new Error(m.message || 'invoke failed'); err.code = m.code; q.reject(err); }
    } else if (m.type === 'trek:confirm:result') {
      var c = pendingConfirms[m.requestId];
      if (c) { delete pendingConfirms[m.requestId]; c(!!m.confirmed); }
    } else if (m.type === 'trek:event') {
      for (var j = 0; j < evtHandlers.length; j++) { try { evtHandlers[j](m.event, m.tripId); } catch (e) {} }
    }
  });

  // Native DOM helpers so a widget can build kit-styled UI with no bundler and no
  // hand-written CSS — every element carries the same trek-* classes the kit ships.
  function mkEl(tag, props, children) {
    var node = document.createElement(tag);
    props = props || {};
    for (var k in props) {
      if (!Object.prototype.hasOwnProperty.call(props, k)) { continue; }
      var v = props[k];
      if (v == null) { continue; }
      if (k === 'class' || k === 'className') { node.className = v; }
      else if (k === 'text') { node.textContent = v; }
      else if (k === 'html') { node.innerHTML = v; }
      else if (k === 'on') { for (var ev in v) { if (Object.prototype.hasOwnProperty.call(v, ev)) { node.addEventListener(ev, v[ev]); } } }
      else { node.setAttribute(k, v); }
    }
    var kids = children == null ? [] : (typeof children === 'string' || children.nodeType ? [children] : children);
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c == null) { continue; }
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }
  var ui = {
    el: mkEl,
    button: function (label, opts) {
      opts = opts || {};
      return mkEl('button', { class: 'trek-btn' + (opts.variant ? ' trek-btn--' + opts.variant : ''), type: 'button', text: label, on: opts.onClick ? { click: opts.onClick } : null }, null);
    },
    card: function (children) { return mkEl('div', { class: 'trek-card' }, children); },
    chip: function (text, variant) { return mkEl('span', { class: 'trek-chip' + (variant ? ' trek-chip--' + variant : ''), text: text }, null); },
    input: function (opts) { opts = opts || {}; return mkEl('input', { class: 'trek-input', type: opts.type || 'text', placeholder: opts.placeholder || '', value: opts.value || '' }, null); },
    mount: function (node, target) { (target || document.body).appendChild(node); return node; }
  };

  var api = {
    context: null,

  <style>
    :root {
      color-scheme: light;
      --bg-card: #ffffff; --bg-primary: #ffffff; --bg-hover: rgba(0,0,0,0.03);
      --text-primary: #111827; --text-secondary: #374151; --text-muted: #6b7280; --text-faint: #9ca3af;
      --border-faint: rgba(0,0,0,0.06); --accent: #111827; --accent-text: #ffffff;
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-card: #131316; --bg-primary: #121215; --bg-hover: rgba(255,255,255,0.06);
      --text-primary: #f4f4f5; --text-secondary: #d4d4d8; --text-muted: #a1a1aa; --text-faint: #71717a;
      --border-faint: rgba(255,255,255,0.07); --accent: #e4e4e7; --accent-text: #09090b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg-card: #131316; --bg-primary: #121215; --bg-hover: rgba(255,255,255,0.06);
        --text-primary: #f4f4f5; --text-secondary: #d4d4d8; --text-muted: #a1a1aa; --text-faint: #71717a;
        --border-faint: rgba(255,255,255,0.07); --accent: #e4e4e7; --accent-text: #09090b;
      }
    }
    * { box-sizing: border-box; }
    svg { width: 1em; height: 1em; flex-shrink: 0; }
    html, body, #app { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
    }
    #app { display: flex; flex-direction: column; }
    .content { flex: 1; overflow: auto; padding: 20px 24px 40px; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 16px 24px 4px; }
    .topbar h1 { font-size: 22px; margin: 0; flex: 1; }
    .search-row { padding: 4px 24px 8px; }
    .guide-search-row { display: flex; align-items: center; gap: 10px; }
    @media (max-width: 639px) {
      /* A fixed-width sort dropdown beside the search box works on desktop, but on a phone-width
         screen it leaves the search input too cramped to type into comfortably — stack them
         instead, each full width. */
      .guide-search-row { flex-direction: column; align-items: stretch; }
      .guide-search-row .trek-select-wrap { width: 100% !important; }
    }
    .search-input { width: 100%; max-width: 480px; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px;
    }
    .guide-card {
      border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-card);
      border: 1px solid var(--border-faint); cursor: pointer; text-align: left;
      display: flex; flex-direction: column;
    }
    .guide-cover {
      height: 130px; position: relative; display: flex; align-items: center; justify-content: center;
      background-size: cover; background-position: center;
    }
    .guide-cover svg { width: 40px; height: 40px; color: rgba(255,255,255,0.85); }
    .guide-cover img { width: 100%; height: 100%; object-fit: cover; }
    .guide-cover .cover-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%); }
    .cover-badge {
      position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 600; color: #fff;
      background: rgba(0,0,0,0.45); padding: 3px 8px; border-radius: 999px;
    }
    .draft-badge {
      position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 600; color: #fff;
      background: #b45309; padding: 3px 8px; border-radius: 999px;
    }
    .guide-meta { padding: 10px 12px 14px; }
    .guide-meta .title { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 0 0 6px; color: var(--text-primary); }
    .guide-meta .loc { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .card-tags .trek-chip { font-size: 10px; padding: 2px 8px; }

    .hero {
      border-radius: var(--radius-lg); padding: 28px 24px; color: #fff; position: relative; overflow: hidden;
      background-size: cover; background-position: center;
    }
    .hero h2 { margin: 0 0 6px; font-size: 26px; }
    .hero .loc { font-size: 13px; opacity: 0.9; display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
    .hero p { font-size: 13px; opacity: 0.95; max-width: 640px; line-height: 1.5; margin: 0; }
    .hero-shade { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%); }
    .hero-content { position: relative; z-index: 1; }
    .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; justify-content: space-between; flex-wrap: wrap; }
    .back-row-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .preview-banner {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      color: var(--info); background: var(--info-soft); padding: 6px 12px; border-radius: 999px;
    }
    .preview-banner svg { width: 14px; height: 14px; }

    /* position:sticky already establishes a containing block for the absolutely-positioned
       prev/next arrows below — no separate position:relative needed. */
    .timeline-nav-wrap {
      position: sticky; top: 0; z-index: 5; background: var(--bg-primary); padding: 10px 0 12px;
    }
    .timeline-nav {
      display: flex; gap: 8px; overflow-x: auto;
      /* A 7+ day itinerary overflows this row and needs the horizontal scroll — but the
         browser's default scrollbar chrome (a thick gray bar sitting right under the pills)
         looked like a layout glitch here, not an intentional control. Hiding it is only safe
         paired with the explicit prev/next arrows below — a mouse with no trackpad/touch input
         has no other way to reach an invisible scrollbar's thumb, so hiding it alone (an earlier
         version of this fix) made the later days genuinely unreachable for those users. */
      scrollbar-width: none; -ms-overflow-style: none;
    }
    /* Only when actually overflowing (JS-toggled, see updateNavArrows): a left/right gutter
       matching the arrow buttons' footprint, so a pill never renders partially underneath one
       (its text would otherwise get visually clipped by the button sitting on top of it at the
       edge). A short itinerary with no arrows keeps the pills flush with the rest of the page. */
    .timeline-nav-wrap.has-overflow .timeline-nav { padding: 0 30px; }
    .timeline-nav::-webkit-scrollbar { display: none; }
    .timeline-nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
      width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-faint);
      background: var(--bg-card); color: var(--text-secondary); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    .timeline-nav-arrow svg { width: 14px; height: 14px; }
    .timeline-nav-arrow:hover { background: var(--bg-hover); }
    .timeline-nav-arrow--prev { left: -4px; }
    .timeline-nav-arrow--next { right: -4px; }
    .timeline-nav-arrow[hidden] { display: none; }
    .timeline-pill {
      flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--border-faint); background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
    }
    .timeline-pill.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    .timeline { position: relative; padding-left: 22px; }
    .timeline::before {
      content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border-faint);
    }
    .day-heading {
      position: relative; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); margin: 26px 0 10px; scroll-margin-top: 52px;
    }
    .day-heading::before {
      content: ''; position: absolute; left: -22px; top: 3px; width: 11px; height: 11px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg-primary);
    }
    .place-card {
      display: flex; gap: 14px; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border-faint);
      background: var(--bg-card); margin-bottom: 10px;
    }
    .place-icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;
    }
    .place-icon svg { width: 20px; height: 20px; color: var(--text-secondary); }
    .place-icon img { width: 100%; height: 100%; object-fit: cover; }
    .place-body { flex: 1; min-width: 0; }
    .place-body .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .place-body .name { font-size: 14px; font-weight: 600; margin: 0; }
    .place-body .desc { font-size: 13px; color: var(--text-secondary); margin: 6px 0 0; line-height: 1.5; }
    .place-body .tips { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--text-muted); }
    .place-actions { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }

    .block-heading { font-weight: 700; margin: 22px 0 10px; color: var(--text-primary); }
    .block-heading--large { font-size: 22px; }
    .block-heading--medium { font-size: 18px; }
    .block-heading--normal { font-size: 15px; }
    .block-body { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin: 0 0 14px; white-space: pre-wrap; }
    .block-quote {
      border-left: 3px solid var(--accent); padding: 6px 0 6px 16px; margin: 14px 0; font-style: italic;
      font-size: 15px; color: var(--text-primary);
    }
    .block-quote .attribution { display: block; margin-top: 6px; font-size: 12px; font-style: normal; color: var(--text-muted); }
    .block-divider { border: none; border-top: 1px solid var(--border-faint); margin: 20px 0; }
    .block-image { margin: 14px 0; }
    .block-image img { width: 100%; max-height: 360px; object-fit: cover; border-radius: var(--radius-md); display: block; }
    .block-image figcaption { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .block-link {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border-faint);
      border-radius: var(--radius-md); background: var(--bg-card); margin: 10px 0; cursor: pointer;
    }
    .block-link svg { color: var(--text-secondary); }
    .block-link .url { font-size: 11px; color: var(--text-faint); user-select: all; word-break: break-all; }
    .block-guide {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border-faint);
      border-radius: var(--radius-md); background: var(--bg-card); margin: 10px 0; cursor: pointer;
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty svg { width: 36px; height: 36px; margin-bottom: 10px; opacity: 0.6; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    .modal { background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; width: 100%; max-width: 460px;
      max-height: 85vh; overflow: auto; border: 1px solid var(--border-faint); }
    .modal h3 { margin: 0 0 12px; font-size: 16px; }
    .trip-pick { display: flex; align-items: center; justify-content: space-between; padding: 10px 0;
      border-bottom: 1px solid var(--border-faint); }
    .trip-pick:last-child { border-bottom: none; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .field-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }

    .admin-guide-row {
      display: flex; align-items: stretch; border: 1px solid var(--border-faint); overflow: hidden;
      border-radius: var(--radius-md); margin-bottom: 10px; background: var(--bg-card);
    }
    .admin-guide-cover {
      width: 200px; flex-shrink: 0; position: relative; min-height: 84px;
      display: flex; align-items: flex-end; background-size: cover; background-position: center;
    }
    .admin-guide-cover svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 26px; height: 26px; color: rgba(255,255,255,0.7); }
    .admin-guide-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .admin-guide-cover .title {
      position: relative; z-index: 1; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.3;
      padding: 8px 10px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .admin-guide-body { display: flex; align-items: center; flex: 1; min-width: 0; gap: 20px; padding: 0 16px; }
    .admin-guide-stats { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
    .admin-guide-stats .stat { text-align: center; min-width: 40px; }
    .admin-guide-stats .stat strong { display: block; font-size: 16px; font-weight: 700; color: var(--text-primary); }
    .admin-guide-stats .stat span { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-muted); }
    .admin-guide-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-shrink: 0; }
    .market-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border-faint);
      border-radius: var(--radius-md); margin-bottom: 8px; background: var(--bg-card); }
    .market-row .market-info { flex: 1; min-width: 0; }
    .market-row .title { font-size: 14px; font-weight: 600; margin: 0; }
    .market-row .loc { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .market-row .desc { font-size: 12px; color: var(--text-secondary); margin: 4px 0; }
    .market-row .market-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .market-thumb { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; }
    .market-thumb--placeholder { display: flex; align-items: center; justify-content: center; background: var(--bg-hover); color: var(--text-faint); }
    .market-thumb--placeholder svg { width: 20px; height: 20px; }
    .market-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex-shrink: 0; }
    .market-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .market-badge--imported { color: var(--text-muted); background: var(--bg-hover); }
    .market-badge--update { color: var(--warning); background: var(--warning-soft); }
    .market-bulk-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
    .trip-comment { display: flex; gap: 10px; margin-bottom: 12px; }
    .trip-comment-avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; margin-top: 1px; }
    .trip-comment-body { flex: 1; min-width: 0; }
    .trip-comment-meta { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .trip-comment-meta strong { font-size: 13px; }
    .trip-comment-meta .when { font-size: 11px; color: var(--text-muted); }
    .trip-comment-text { font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .search-result { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-faint); }
    .search-result:last-child { border-bottom: none; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }

    .template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .template-card {
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px;
      border: 1px solid var(--border-faint); border-radius: var(--radius-md); background: var(--bg-card);
      cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-primary);
    }
    .template-card svg { width: 22px; height: 22px; color: var(--text-secondary); }
    .template-card.active { border-color: var(--accent); border-width: 2px; }
    .template-card.active svg { color: var(--accent); }
    .day-count-row { margin-top: 10px; max-width: 220px; }
    .empty-day-hint { font-size: 12px; color: var(--text-faint); font-style: italic; margin: 0 0 10px; }

    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .status-chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      padding: 4px 10px; border-radius: 999px; }
    .status-chip--draft { background: rgba(180,83,9,0.15); color: #b45309; }
    .status-chip--published { background: rgba(22,163,74,0.15); color: #16a34a; }

    .block-row {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px; border: 1px solid var(--border-faint);
      border-radius: var(--radius-md); background: var(--bg-card); margin-bottom: 8px;
    }
    .block-row .drag-handle { cursor: grab; color: var(--text-faint); padding-top: 4px; }
    .block-row.dragging { opacity: 0.4; }
    .block-row .block-preview { flex: 1; min-width: 0; }
    .block-row .block-type-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); margin-bottom: 4px; }
    .block-row .block-actions { display: flex; gap: 6px; flex-shrink: 0; }
    /* A Day block reads as a section header — a subtly tinted band — rather than looking
       identical to every place/text row under it, and everything until the next Day gets a
       slight indent, so a long itinerary scans as day-grouped sections instead of one flat,
       undifferentiated list. */
    .block-row--day { background: var(--accent-subtle); border-color: var(--border-primary); }
    .block-row--day .block-preview { font-weight: 600; }
    .block-row--indented { margin-left: 20px; }

    /* A calm, icon-only action button — a filled solid-red delete button on every single row of
       a long content list reads as a wall of warnings rather than a list of content. Same idea
       at rest as the secondary button; only the destructive one tints on hover, so its danger is
       discoverable without dominating the page by default. */
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border-faint);
      background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .icon-btn:hover { background: var(--bg-hover); }
    .icon-btn--danger { color: var(--danger); }
    .icon-btn--danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .icon-btn--featured { color: var(--warning); background: var(--warning-soft); border-color: var(--warning); }
    .icon-btn--featured svg { fill: currentColor; }

    /* Bottom-right of the cover — top-left already holds the place/day count (.cover-badge) and
       top-right the admin-only Draft indicator (.draft-badge); a featured guide can be a draft
       too, so this needs its own corner rather than fighting either for the same spot. */
    .featured-badge {
      position: absolute; bottom: 8px; right: 8px; display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #fff;
      background: rgba(217,119,6,0.85); padding: 3px 8px; border-radius: 999px;
    }
    .featured-badge svg { width: 11px; height: 11px; fill: currentColor; }
    /* Top-left of the cover is the one corner not already claimed — top-right is the Draft
       badge, bottom-right is Featured. */
    .admin-guide-check {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      width: 22px; height: 22px; border-radius: 6px; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .admin-guide-check input { width: 15px; height: 15px; cursor: pointer; }
    .admin-bulk-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; flex-wrap: wrap; }

    .add-item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin: 14px 0; }
    .add-item-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px;
      border: 1px solid var(--border-faint); border-radius: var(--radius-md); background: var(--bg-card);
      cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-align: center;
    }
    .add-item-btn:hover { background: var(--bg-hover); border-color: var(--border-primary); }
    .add-item-btn svg { width: 18px; height: 18px; color: var(--text-secondary); }
    .trek-select-trigger { width: 100%; }
    .cat-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap;
    }
    .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* Mobile: the layout above is row/grid-first for a desktop-width admin panel — on a
       narrow phone viewport those fixed-width rows (a 200px cover next to stats next to
       action icons, a 3-column template grid, a search box beside a location <select>)
       either overflow or squash into unreadable strips. Stack them instead. */
    @media (max-width: 639px) {
      .topbar { flex-wrap: wrap; row-gap: 8px; padding: 12px 14px 4px; }
      .topbar h1 { font-size: 18px; }
      #adminToggle { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
      .search-row { padding: 4px 14px 8px; }
      .content { padding: 14px 14px 32px; }

      .hero { padding: 20px 16px; }
      .hero h2 { font-size: 20px; }

      .form-grid { grid-template-columns: 1fr; }
      .template-grid { grid-template-columns: repeat(2, 1fr); }

      .admin-guide-row { flex-direction: column; }
      .admin-guide-cover { width: 100%; min-height: 96px; }
      .admin-guide-body { flex-wrap: wrap; padding: 12px 14px; row-gap: 10px; }
      .admin-guide-stats { flex-wrap: wrap; row-gap: 8px; }
      .admin-guide-actions { margin-left: 0; width: 100%; justify-content: flex-end; }

      .market-row { flex-wrap: wrap; }
      .market-actions { flex-direction: row; width: 100%; justify-content: flex-end; margin-top: 4px; }
      #marketplaceFilterRow { flex-wrap: wrap; }
      #marketplaceFilterRow > * { flex: 1 1 100% !important; }

      .modal-backdrop { padding: 12px; }
      .modal { padding: 16px; max-height: 90vh; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="pageTitle">Community Trips</h1>
    <span id="adminToggle"></span>
  </div>
  <div id="searchRow" class="search-row"></div>
  <div class="content" id="content"></div>
</div>
<div id="modalRoot"></div>

<script>
(function () {
  var ICONS = {
    compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>',
    store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/><path d="M9 21v-6h6v6"/></svg>',
    message: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  };
  var CATEGORIES = ['Activity', 'Attraction', 'Bar/Cafe', 'Beach', 'Hotel', 'Nature', 'Other', 'Restaurant', 'Shopping', 'Transport'];
  var CATEGORY_COLORS = {
    'Activity': '#10b981', 'Attraction': '#8b5cf6', 'Bar/Cafe': '#f97316', 'Beach': '#06b6d4',
    'Hotel': '#3b82f6', 'Nature': '#84cc16', 'Other': '#6366f1', 'Restaurant': '#ef4444',
    'Shopping': '#f59e0b', 'Transport': '#6b7280',
  };
  function hexToRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function categoryChipHtml(category) {
    if (!category) return '';
    var hex = CATEGORY_COLORS[category] || CATEGORY_COLORS['Other'];
    var rgb = hexToRgb(hex).join(',');
    return '<span class="cat-chip" style="background:rgba(' + rgb + ',0.14);color:' + hex + ';border-color:rgba(' + rgb + ',0.35)">' +
      '<span class="cat-dot" style="background:' + hex + '"></span>' + esc(category) + '</span>';
  }

  var GRADIENTS = [
    ['#2b5876', '#4e4376'], ['#1f4037', '#99f2c8'], ['#654ea3', '#eaafc8'],
    ['#0f2027', '#2c5364'], ['#8e2de2', '#4a00e0'], ['#134e5e', '#71b280'],
    ['#3a1c71', '#d76d77'], ['#0b486b', '#f56217']
  ];
  function gradientFor(seed) {
    var h = 0;
    for (var i = 0; i < String(seed).length; i++) h = (h * 31 + String(seed).charCodeAt(i)) >>> 0;
    var pair = GRADIENTS[h % GRADIENTS.length];
    return 'linear-gradient(135deg,' + pair[0] + ',' + pair[1] + ')';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Coarse "2h ago" / "3d ago" style relative time for suggestion timestamps — GitHub's
  // createdAt is always a valid ISO string here, so no parse-failure fallback is needed.
  function timeAgo(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    var days = Math.floor(hours / 24);
    if (days < 30) return days + 'd ago';
    var months = Math.floor(days / 30);
    if (months < 12) return months + 'mo ago';
    return Math.floor(months / 12) + 'y ago';
  }

  var MARKETPLACE_BASE = 'https://raw.githubusercontent.com/raduwolf12/featured-guides/main/marketplace/';

  var modalRoot = document.getElementById('modalRoot');
  var contentEl = document.getElementById('content');
  var searchRowEl = document.getElementById('searchRow');
  var adminToggleEl = document.getElementById('adminToggle');

  var state = {
    isAdmin: false,
    hasGithubPat: false,
    trips: null,       // Community Trips index.json entries, fetched once per page session
    search: '',
    myImports: null,   // this user's locally-imported drafts
  };

  function api(sub, opts) {
    return trek.invoke(sub, opts || {}).catch(function (e) {
      trek.notify('error', (e && e.message) || 'Something went wrong');
      throw e;
    });
  }
  function closeModal() { modalRoot.innerHTML = ''; }

  function marketplaceEntryKey(e) { return e.id != null ? String(e.id) : e.file; }

  // Public, keyless read of the marketplace repo's own JSON — no server round trip, matching the
  // same pattern Featured Guides' own marketplace list already uses.
  function fetchMarketplaceJson(path, label) {
    return fetch(MARKETPLACE_BASE + path + '?_=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load "' + (label || path) + '" (' + res.status + ')');
        return res.json();
      });
  }

  function visibleTrips() {
    var all = state.trips || [];
    var q = state.search.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function (e) { return (e.title + ' ' + (e.location || '')).toLowerCase().indexOf(q) !== -1; });
  }

  function render() {
    adminToggleEl.innerHTML = state.isAdmin
      ? '<button class="trek-btn trek-btn--secondary" id="shareTripBtn" type="button">' + ICONS.upload + ' Share a trip</button>'
      : '';
    var shareBtn = document.getElementById('shareTripBtn');
    if (shareBtn) shareBtn.addEventListener('click', openShareTripModal);

    searchRowEl.innerHTML =
      '<input type="text" id="searchInput" class="trek-input search-input" placeholder="Search community trips…" value="' + esc(state.search) + '">';
    var searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function () { state.search = searchInput.value; renderList(); });

    if (state.trips == null) {
      contentEl.innerHTML = '<div class="trek-muted">Loading…</div>';
      fetchMarketplaceJson('trips/index.json', 'Community Trips')
        .then(function (list) {
          state.trips = Array.isArray(list) ? list.slice().sort(function (a, b) { return String(b.addedAt || '').localeCompare(String(a.addedAt || '')); }) : [];
          renderList();
        })
        .catch(function (e) {
          contentEl.innerHTML = '<div class="empty">' + ICONS.compass + '<div>' + esc(e.message || 'Could not load Community Trips.') + '</div></div>';
        });
      return;
    }
    renderList();
  }

  function renderList() {
    var entries = visibleTrips();
    var listHtml;
    if (!state.trips.length) {
      listHtml = '<div class="empty">' + ICONS.compass + '<div>No community trips shared yet — be the first with <strong>Share a trip</strong> above.</div></div>';
    } else if (!entries.length) {
      listHtml = '<div class="trek-muted">No shared trips match your search.</div>';
    } else {
      listHtml = entries.map(function (e) {
        var key = marketplaceEntryKey(e);
        var badge = e.days ? (e.days + (e.days === 1 ? ' day' : ' days')) : (e.placeCount != null ? e.placeCount + (e.placeCount === 1 ? ' place' : ' places') : '');
        var thumb = e.coverPhoto
          ? '<img class="market-thumb" src="' + esc(e.coverPhoto) + '" alt="" />'
          : '<div class="market-thumb market-thumb--placeholder">' + ICONS.compass + '</div>';
        return '<div class="market-row">' +
          thumb +
          '<div class="market-info">' +
            '<p class="title">' + esc(e.title || 'Untitled') + '</p>' +
            (e.location ? '<div class="loc">' + ICONS.pin + esc(e.location) + '</div>' : '') +
            (e.description ? '<p class="desc">' + esc(e.description).slice(0, 160) + '</p>' : '') +
            '<div class="market-meta">' +
              (badge ? '<span class="trek-muted" style="font-size:12px">' + esc(badge) + '</span>' : '') +
              (e.author ? '<span class="trek-muted" style="font-size:12px">by ' + esc(e.author) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="market-actions">' +
            '<button class="icon-btn" data-view-key="' + esc(key) + '" type="button" title="View trip and suggestions" aria-label="View “' + esc(e.title || 'Untitled') + '”">' + ICONS.eye + '</button>' +
            '<button class="trek-btn trek-btn--primary" data-import-key="' + esc(key) + '" type="button">' + ICONS.plus + ' Import</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    var importsHtml = '';
    if (state.myImports && state.myImports.length) {
      importsHtml =
        '<h4 style="margin:24px 0 8px">My imported trips</h4>' +
        state.myImports.map(function (t) {
          return '<div class="market-row">' +
            '<div class="market-thumb market-thumb--placeholder">' + ICONS.compass + '</div>' +
            '<div class="market-info">' +
              '<p class="title">' + esc(t.title) + '</p>' +
              (t.location ? '<div class="loc">' + ICONS.pin + esc(t.location) + '</div>' : '') +
            '</div>' +
            '<div class="market-actions">' +
              '<button class="icon-btn" data-view-import="' + t.id + '" type="button" title="View itinerary">' + ICONS.eye + '</button>' +
              '<button class="icon-btn icon-btn--danger" data-delete-import="' + t.id + '" type="button" title="Remove">' + ICONS.trash + '</button>' +
            '</div>' +
          '</div>';
        }).join('');
    }

    contentEl.innerHTML = listHtml + importsHtml;

    contentEl.querySelectorAll('button[data-view-key]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var entry = entries.find(function (e) { return marketplaceEntryKey(e) === btn.getAttribute('data-view-key'); });
        openCommunityTripModal(entry);
      });
    });
    contentEl.querySelectorAll('button[data-import-key]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var entry = entries.find(function (e) { return marketplaceEntryKey(e) === btn.getAttribute('data-import-key'); });
        importTrip(entry, btn);
      });
    });
    contentEl.querySelectorAll('button[data-view-import]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = Number(btn.getAttribute('data-view-import'));
        var t = (state.myImports || []).find(function (x) { return x.id === id; });
        if (t) openImportedTripModal(t);
      });
    });
    contentEl.querySelectorAll('button[data-delete-import]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = Number(btn.getAttribute('data-delete-import'));
        trek.confirm({ title: 'Remove this trip?', message: 'This only removes your local copy — nothing on GitHub changes.', danger: true, confirmLabel: 'Remove' })
          .then(function (ok) {
            if (!ok) return;
            api('/trip/imports?id=' + id, { method: 'DELETE' }).then(function () {
              state.myImports = state.myImports.filter(function (x) { return x.id !== id; });
              renderList();
            });
          });
      });
    });

    if (state.myImports == null) {
      api('/trip/imports').then(function (d) { state.myImports = d.imports || []; renderList(); }).catch(function () {});
    }
  }

  // Fetches a trip's full JSON straight from GitHub (public, keyless) and stores a local,
  // read-only draft copy of it — same "lands as a Draft" behavior the old Featured-Guides-hosted
  // import had, just kept here as a lightweight itinerary viewer instead of a full guide editor.
  function importTrip(entry, btn) {
    btn.textContent = 'Importing…'; btn.disabled = true;
    fetchMarketplaceJson(entry.file, entry.title)
      .then(function (payload) {
        return api('/trip/import', {
          method: 'POST',
          body: {
            slug: marketplaceEntryKey(entry), title: payload.guide.title || entry.title,
            location: payload.guide.location || entry.location || null,
            blocks: Array.isArray(payload.blocks) ? payload.blocks : [],
            sourceUpdatedAt: entry.updatedAt || null,
          },
        });
      })
      .then(function () {
        trek.notify('success', 'Imported "' + entry.title + '" — see it under "My imported trips" below.');
        state.myImports = null; // refetch
        renderList();
      })
      .catch(function (e) { trek.notify('error', (e && e.message) || 'Could not import that trip.'); })
      .then(function () { btn.innerHTML = ICONS.plus + ' Import'; btn.disabled = false; });
  }

  // Groups a flat block list into {introBlocks, days[]} — same grouping logic the trip detail
  // modal below uses, extracted so the read-only "My imported trips" viewer can reuse it too.
  function groupTripBlocks(blocks) {
    var introBlocks = [];
    var days = [];
    var currentDay = null;
    (blocks || []).forEach(function (b) {
      if (b.type === 'day') {
        currentDay = { title: (b.data && b.data.title) || null, dayNumber: b.data && b.data.dayNumber, places: [] };
        days.push(currentDay);
      } else if (b.type === 'place' || b.type === 'activity') {
        var target = currentDay || (days.length ? days[days.length - 1] : null);
        if (target) target.places.push(b.data || {});
        else { if (!days.length || days[0].dayNumber != null) days.unshift({ title: null, dayNumber: null, places: [] }); days[0].places.push(b.data || {}); }
      } else if (b.type === 'heading' || b.type === 'body') {
        introBlocks.push(b);
      }
    });
    return { introBlocks: introBlocks, days: days };
  }

  function itineraryHtml(introBlocks, days) {
    return introBlocks.map(function (b) {
      return b.type === 'heading'
        ? '<div style="font-weight:600;margin:10px 0 4px">' + esc((b.data && b.data.text) || '') + '</div>'
        : '<p class="trek-muted" style="margin:2px 0">' + esc((b.data && b.data.text) || '') + '</p>';
    }).join('') +
    '<div style="max-height:280px;overflow:auto;margin-top:6px">' +
      days.map(function (d) {
        var heading = d.dayNumber != null ? 'Day ' + d.dayNumber + (d.title ? ': ' + esc(d.title) : '') : (days.length > 1 ? 'Unscheduled' : '');
        return (heading ? '<div style="font-weight:600;margin:10px 0 4px">' + heading + '</div>' : '') +
          d.places.map(function (p) {
            return '<div style="padding:6px 0;border-bottom:1px solid var(--border-faint)">' +
              '<strong>' + esc(p.name || 'Untitled') + '</strong> ' + categoryChipHtml(p.category) +
              (p.address ? '<div class="trek-muted" style="font-size:12px">' + esc(p.address) + '</div>' : '') +
              (p.description ? '<div style="font-size:13px;margin-top:2px">' + esc(p.description).slice(0, 200) + '</div>' : '') +
            '</div>';
          }).join('');
      }).join('') +
    '</div>';
  }

  // Read-only view of one of your own locally-imported drafts — no editing, no publishing;
  // these are pulled-in copies of someone else's trip, not authored content.
  function openImportedTripModal(t) {
    var grouped = groupTripBlocks(t.blocks);
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="itBackdrop"><div class="modal" style="max-width:600px">' +
        '<h3>' + esc(t.title) + '</h3>' +
        (t.location ? '<div class="loc">' + ICONS.pin + esc(t.location) + '</div>' : '') +
        '<div style="margin-top:10px">' + itineraryHtml(grouped.introBlocks, grouped.days) + '</div>' +
        '<div class="btn-row" style="margin-top:14px;justify-content:flex-end">' +
          '<button class="trek-btn trek-btn--secondary" id="itClose" type="button">Close</button>' +
        '</div>' +
      '</div></div>';
    document.getElementById('itBackdrop').addEventListener('click', function (e) { if (e.target.id === 'itBackdrop') closeModal(); });
    document.getElementById('itClose').addEventListener('click', closeModal);
  }

  // ---------------- Trip detail: itinerary + Suggestions ----------------
  function openCommunityTripModal(entry) {
    if (!entry) return;
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="ctBackdrop"><div class="modal" style="max-width:640px">' +
        '<div class="btn-row" style="justify-content:space-between;align-items:flex-start;gap:8px">' +
          '<h3 style="margin:0">' + esc(entry.title || 'Trip') + '</h3>' +
          (entry.discussionUrl
            ? '<button class="icon-btn" id="ctViewOnGithub" type="button" title="Open discussion on GitHub" aria-label="Open discussion on GitHub">' + ICONS.upload + '</button>'
            : '') +
        '</div>' +
        (entry.location ? '<div class="loc">' + ICONS.pin + esc(entry.location) + '</div>' : '') +
        '<div class="trek-muted" style="font-size:12px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">' +
          (entry.author ? '<span>Shared by ' + esc(entry.author) + '</span>' : '') +
          (entry.addedAt ? '<span>' + esc(entry.addedAt) + '</span>' : '') +
        '</div>' +
        '<div id="communityTripSummary" class="trek-muted" style="font-size:12px;margin-top:4px"></div>' +
        '<div id="communityTripItinerary" class="trek-muted" style="margin-top:10px">Loading…</div>' +
        '<h4 style="margin:18px 0 8px;display:flex;align-items:center;gap:6px">' + ICONS.message + ' <span id="communityTripCommentCount">Suggestions</span></h4>' +
        '<div id="communityTripComments" class="trek-muted">Loading…</div>' +
        '<div class="btn-row" style="margin-top:10px;align-items:flex-start">' +
          '<div style="flex:1">' +
            '<input type="text" id="communityTripSuggestionInput" placeholder="Add a suggestion…" maxlength="2000" style="width:100%">' +
            '<div class="trek-muted" id="communityTripSuggestionCounter" style="font-size:11px;text-align:right;margin-top:2px">2000 left</div>' +
          '</div>' +
          '<button class="trek-btn trek-btn--primary" id="communityTripSuggestionPost" type="button">Post</button>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:14px;justify-content:flex-end;gap:8px">' +
          '<button class="trek-btn trek-btn--secondary" id="ctBack" type="button">Close</button>' +
          '<button class="trek-btn trek-btn--primary" id="ctImport" type="button">' + ICONS.plus + ' Import</button>' +
        '</div>' +
      '</div></div>';
    document.getElementById('ctBackdrop').addEventListener('click', function (e) { if (e.target.id === 'ctBackdrop') closeModal(); });
    document.getElementById('ctBack').addEventListener('click', closeModal);
    if (entry.discussionUrl) {
      document.getElementById('ctViewOnGithub').addEventListener('click', function () { trek.openExternal(entry.discussionUrl); });
    }
    var suggestionInput = document.getElementById('communityTripSuggestionInput');
    var suggestionCounter = document.getElementById('communityTripSuggestionCounter');
    suggestionInput.addEventListener('input', function () {
      suggestionCounter.textContent = (2000 - suggestionInput.value.length) + ' left';
    });
    suggestionInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('communityTripSuggestionPost').click(); }
    });
    document.getElementById('ctImport').addEventListener('click', function () {
      var btn = document.getElementById('ctImport');
      importTrip(entry, btn);
    });

    // ---- Itinerary ----
    var itinEl = document.getElementById('communityTripItinerary');
    var summaryEl = document.getElementById('communityTripSummary');
    fetchMarketplaceJson(entry.file, entry.title)
      .then(function (payload) {
        var blocks = Array.isArray(payload.blocks) ? payload.blocks : [];
        var grouped = groupTripBlocks(blocks);
        var placeCount = entry.placeCount != null ? entry.placeCount : blocks.filter(function (b) { return b.type === 'place' || b.type === 'activity'; }).length;
        var dayCount = entry.days != null ? entry.days : grouped.days.length;
        summaryEl.textContent = placeCount + (placeCount === 1 ? ' place' : ' places') +
          (dayCount ? ' · ' + dayCount + (dayCount === 1 ? ' day' : ' days') : '');
        itinEl.className = '';
        itinEl.innerHTML =
          (payload.guide.description ? '<p style="margin:0 0 10px">' + esc(payload.guide.description).slice(0, 400) + '</p>' : '') +
          itineraryHtml(grouped.introBlocks, grouped.days);
      })
      .catch(function (e) {
        itinEl.innerHTML = '<div class="trek-muted">' + esc(e.message || "Could not load this trip's itinerary.") + '</div>';
      });

    // ---- Suggestions ----
    var commentsEl = document.getElementById('communityTripComments');
    var countEl = document.getElementById('communityTripCommentCount');
    var tripComments = [];
    function renderTripComments() {
      countEl.textContent = 'Suggestions' + (tripComments.length ? ' (' + tripComments.length + ')' : '');
      if (!tripComments.length) { commentsEl.innerHTML = '<div class="trek-muted">No suggestions yet — be the first.</div>'; return; }
      commentsEl.innerHTML = tripComments.map(function (c) {
        var name = c.author || 'someone';
        return '<div class="trip-comment">' +
          '<div class="trip-comment-avatar" style="background:' + gradientFor(name) + '">' + esc(name.slice(0, 1).toUpperCase()) + '</div>' +
          '<div class="trip-comment-body">' +
            '<div class="trip-comment-meta"><strong>' + esc(name) + '</strong>' +
              (c.createdAt ? '<span class="when">' + esc(timeAgo(c.createdAt)) + '</span>' : '') +
            '</div>' +
            '<div class="trip-comment-text">' + esc(c.body) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    if (!entry.discussionUrl) {
      commentsEl.innerHTML = '<div class="trek-muted">This trip has no linked suggestions thread.</div>';
      document.getElementById('communityTripSuggestionInput').disabled = true;
      document.getElementById('communityTripSuggestionPost').disabled = true;
    } else {
      api('/marketplace/trip-comments?discussionUrl=' + encodeURIComponent(entry.discussionUrl))
        .then(function (d) {
          if (d.needsToken) {
            commentsEl.innerHTML = '<div class="trek-muted">Set a GitHub personal access token in this plugin\'s settings to read and post suggestions.</div>';
            return;
          }
          tripComments = d.comments || [];
          renderTripComments();
        })
        .catch(function () { commentsEl.textContent = 'Could not load suggestions.'; });

      document.getElementById('communityTripSuggestionPost').addEventListener('click', function () {
        var input = document.getElementById('communityTripSuggestionInput');
        var body = input.value.trim();
        if (!body) return;
        this.disabled = true;
        api('/marketplace/trip-comments', { method: 'POST', body: { discussionUrl: entry.discussionUrl, body: body } })
          .then(function (d) {
            tripComments.push(d);
            renderTripComments();
            input.value = '';
            suggestionCounter.textContent = '2000 left';
          })
          .catch(function (e) { trek.notify('error', (e && e.message) || 'Could not post that suggestion.'); })
          .then(function () { document.getElementById('communityTripSuggestionPost').disabled = false; });
      });
    }
  }

  // ---------------- Share one of your own trips ----------------
  function openShareTripModal() {
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="backdrop">' +
        '<div class="modal">' +
          '<h3>Share a trip to Community Trips</h3>' +
          '<p class="trek-muted" style="margin:0 0 14px">' +
            'Opens a pull request against the marketplace repo with this trip\'s places and days, ' +
            'plus a Discussion thread for suggestions. Needs a GitHub personal access token set in ' +
            'this plugin\'s settings first.' +
          '</p>' +
          '<div id="shareTripList" class="trek-muted">Loading your trips…</div>' +
          '<div class="btn-row" style="margin-top:14px;justify-content:flex-end">' +
            '<button class="trek-btn trek-btn--secondary" id="stCancel" type="button">Cancel</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('backdrop').addEventListener('click', function (e) { if (e.target.id === 'backdrop') closeModal(); });
    document.getElementById('stCancel').addEventListener('click', closeModal);

    Promise.all([
      api('/trips').then(function (d) { return d.trips; }),
      api('/trip/shares').then(function (d) { return d.shares; }).catch(function () { return []; }),
    ])
      .then(function (results) {
        var trips = results[0];
        var shares = results[1];
        var shareByTripId = {};
        shares.forEach(function (s) { shareByTripId[s.tripId] = s; });

        var box = document.getElementById('shareTripList');
        if (!box) return;
        if (!trips || !trips.length) { box.textContent = "You don't have any trips yet."; return; }
        box.innerHTML = trips.map(function (t) {
          var share = shareByTripId[t.id];
          return '<div class="trip-pick"><span>' + esc(t.title) + '</span>' +
            (share
              ? '<button class="trek-btn trek-btn--secondary" data-view-suggestions="' + t.id + '" type="button">Suggestions</button>'
              : '<button class="trek-btn trek-btn--primary" data-trip="' + t.id + '" type="button">Share</button>') +
            '</div>';
        }).join('');
        box.querySelectorAll('button[data-trip]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var tripId = Number(btn.getAttribute('data-trip'));
            btn.textContent = 'Sharing…'; btn.disabled = true;
            api('/trip/share', { method: 'POST', body: { tripId: tripId } })
              .then(function (d) {
                closeModal();
                d.tripId = tripId;
                openShareResultModal(d);
              })
              .catch(function (e) {
                btn.textContent = 'Share'; btn.disabled = false;
                trek.notify('error', (e && e.message) || 'Could not share this trip.');
              });
          });
        });
        box.querySelectorAll('button[data-view-suggestions]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openTripSuggestionsModal(Number(btn.getAttribute('data-view-suggestions')));
          });
        });
      })
      .catch(function () {
        var box = document.getElementById('shareTripList');
        if (box) box.textContent = "Couldn't load your trips — try closing and reopening this.";
      });
  }

  // Shown right after a successful (or already-done) share — the PR still needs a human
  // (repo owner) to review and merge before it shows up in the browse list, so this is
  // deliberately "here's where to watch", not "it's live now".
  function openShareResultModal(d) {
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="backdrop">' +
        '<div class="modal">' +
          '<h3>' + (d.alreadyShared ? 'Already shared' : 'Shared!') + '</h3>' +
          '<p class="trek-muted" style="margin:0 0 14px">' +
            (d.alreadyShared
              ? 'This trip already has an open share. '
              : 'A pull request and a suggestions thread were opened just now. ') +
            'Once the pull request is reviewed and merged, the trip appears in this ' +
            'plugin\'s browse list for anyone to import.' +
          '</p>' +
          '<div class="btn-row" style="gap:8px;flex-wrap:wrap">' +
            '<button class="trek-btn trek-btn--secondary" id="srViewPr" type="button">View pull request</button>' +
            '<button class="trek-btn trek-btn--secondary" id="srViewSuggestions" type="button">View suggestions</button>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:14px;justify-content:flex-end">' +
            '<button class="trek-btn trek-btn--secondary" id="srClose" type="button">Close</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('backdrop').addEventListener('click', function (e) { if (e.target.id === 'backdrop') closeModal(); });
    document.getElementById('srClose').addEventListener('click', closeModal);
    // Plain <a target="_blank"> is silently blocked — the plugin iframe's sandbox has no
    // allow-popups — and a plain navigation would sever the trek:* bridge for the rest of this
    // session. Route through the host instead.
    document.getElementById('srViewPr').addEventListener('click', function () { trek.openExternal(d.prUrl); });
    document.getElementById('srViewSuggestions').addEventListener('click', function () {
      if (d.tripId != null) { openTripSuggestionsModal(d.tripId); }
      else { trek.openExternal(d.discussionUrl); }
    });
  }

  // ---------------- Suggestions on a trip you shared yourself ----------------
  function openTripSuggestionsModal(tripId) {
    modalRoot.innerHTML =
      '<div class="modal-backdrop" id="backdrop">' +
        '<div class="modal">' +
          '<div class="btn-row" style="justify-content:space-between;align-items:center">' +
            '<h3 style="margin:0">Suggestions</h3>' +
            '<button class="icon-btn" id="sgViewOnGithub" type="button" title="Open discussion on GitHub" style="display:none">' + ICONS.upload + '</button>' +
          '</div>' +
          '<div id="suggestionsList" class="trek-muted">Loading…</div>' +
          '<div class="btn-row" style="margin-top:10px">' +
            '<input type="text" id="suggestionInput" placeholder="Add a suggestion…" maxlength="2000" style="flex:1">' +
            '<button class="trek-btn trek-btn--primary" id="suggestionPost" type="button">Post</button>' +
          '</div>' +
          '<div class="btn-row" style="margin-top:14px;justify-content:flex-end">' +
            '<button class="trek-btn trek-btn--secondary" id="sgClose" type="button">Close</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('backdrop').addEventListener('click', function (e) { if (e.target.id === 'backdrop') closeModal(); });
    document.getElementById('sgClose').addEventListener('click', closeModal);

    function renderComments(comments) {
      var box = document.getElementById('suggestionsList');
      if (!box) return;
      if (!comments.length) { box.innerHTML = '<div class="trek-muted">No suggestions yet — be the first.</div>'; return; }
      box.innerHTML = comments.map(function (c) {
        var name = c.author || 'someone';
        return '<div class="trip-comment">' +
          '<div class="trip-comment-avatar" style="background:' + gradientFor(name) + '">' + esc(name.slice(0, 1).toUpperCase()) + '</div>' +
          '<div class="trip-comment-body">' +
            '<div class="trip-comment-meta"><strong>' + esc(name) + '</strong>' +
              (c.createdAt ? '<span class="when">' + esc(timeAgo(c.createdAt)) + '</span>' : '') +
            '</div>' +
            '<div class="trip-comment-text">' + esc(c.body) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    api('/trip/suggestions?tripId=' + tripId)
      .then(function (d) {
        if (d.discussionUrl) {
          var viewBtn = document.getElementById('sgViewOnGithub');
          viewBtn.style.display = '';
          viewBtn.addEventListener('click', function () { trek.openExternal(d.discussionUrl); });
        }
        if (!d.shared) { renderComments([]); return; }
        if (d.needsToken) {
          document.getElementById('suggestionsList').innerHTML =
            '<div class="trek-muted">Set a GitHub personal access token in this plugin\'s settings to read and post suggestions.</div>';
          return;
        }
        renderComments(d.comments || []);
      })
      .catch(function () {
        var box = document.getElementById('suggestionsList');
        if (box) box.textContent = "Couldn't load suggestions.";
      });

    document.getElementById('suggestionPost').addEventListener('click', function () {
      var input = document.getElementById('suggestionInput');
      var body = input.value.trim();
      if (!body) return;
      this.disabled = true;
      api('/trip/suggestions', { method: 'POST', body: { tripId: tripId, body: body } })
        .then(function () { return api('/trip/suggestions?tripId=' + tripId); })
        .then(function (d) { renderComments(d.comments || []); input.value = ''; })
        .catch(function () { trek.notify('error', 'Could not post that suggestion.'); })
        .then(function () { document.getElementById('suggestionPost').disabled = false; });
    });
  }

  // ---------------- Boot ----------------
  trek.onContext(function (ctx) {
    state.isAdmin = !!(ctx.user && ctx.user.isAdmin);
    render();
  });
  api('/me/github-pat-status').then(function (d) { state.hasGithubPat = !!d.hasToken; }).catch(function () {});
})();
</script>
</body>
</html>
